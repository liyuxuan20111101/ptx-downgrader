name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash            # Windows runners default to pwsh; bash keeps steps identical
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install numpy

      - name: mma fragment simulators vs numpy (k16 + k8)
        run: |
          python tools/sim_mma.py
          python tools/sim_mma8.py

      - name: CLI downgrade smoke test (mixed kernel)
        run: python -m downgrader m1/kernels/k13_mixed.ptx -o build/k13_mixed.sm61.ptx --no-validate

      - name: Downgrade all test kernels
        run: python tools/ci_downgrade_all.py

      - name: Idempotency check (second downgrade is a no-op)
        run: python tools/ci_idempotency.py

      - name: Reject-list coverage audit
        run: python tools/audit_reject.py

      - name: ptxas validation (Windows runner only — tools are Windows binaries)
        if: runner.os == 'Windows'
        run: |
          python setup_tools.py
          python tools/ci_validate.py
